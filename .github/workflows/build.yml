name: build-addon

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Only the header files are needed (include/ plus the bundled imgui.h)
      - name: Download ReShade headers
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/crosire/reshade.git reshade-src
          git -C reshade-src submodule update --init --depth 1 deps/imgui

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile
        shell: pwsh
        run: cl /nologo /std:c++17 /EHsc /O2 /LD /I reshade-src\include /I reshade-src\deps\imgui compass_probe.cpp /Fe:compass_probe.dll user32.lib

      - name: Rename to .addon64
        shell: pwsh
        run: Rename-Item compass_probe.dll compass_probe.addon64

      - uses: actions/upload-artifact@v4
        with:
          name: compass_probe-addon
          path: compass_probe.addon64
